name: 옵션 대시보드 자동 갱신

on:
  schedule:
    # UTC 기준. 한 번 도는 데 1분도 안 걸리고 비용도 없어서 촘촘히 돌린다.
    # 미국 정규장 = 13:30~20:00 UTC (한국 밤 10:30~새벽 5:00, 서머타임 기준)
    - cron: "*/15 13-20 * * 1-5"
    # 장 마감 직후 정리분
    - cron: "5,20 20 * * 1-5"
    # 새 계약 수는 OPRA 발표(10:30 UTC)보다 늦게, 실측상 11:00 UTC 무렵 야후에 들어온다.
    # 도착 직후부터 저녁 전망 글 쓰기 전까지 촘촘히 확인한다 (한국 저녁 8시~9시).
    - cron: "0,15,30,45 11 * * 1-5"
    # 아침 전망 글 쓰기 직전 (한국 아침 6시 30분)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install --quiet -r requirements.txt

      - name: 데이터 수집과 대시보드 생성
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
          TICKERS: QQQ NVDA TSLA AMZN GOOGL SOXX PLTR CRWV IREN IONQ TEM EWY
        run: |
          for TK in $TICKERS; do
            python collect.py "$TK" || echo "::warning::$TK 수집 실패"
          done
          python flows.py $TICKERS || true
          for TK in $TICKERS; do
            python make_dashboard.py "$TK" || echo "::warning::$TK 생성 실패"
          done

      - name: 웹 폴더로 복사
        env:
          TICKERS: QQQ NVDA TSLA AMZN GOOGL SOXX PLTR CRWV IREN IONQ TEM EWY
        run: |
          mkdir -p docs
          for TK in $TICKERS; do
            [ -f "dashboard/${TK}_dashboard.html" ] && cp "dashboard/${TK}_dashboard.html" "docs/${TK}.html"
          done
          cp docs/QQQ.html docs/index.html
          touch docs/.nojekyll
          # 스냅샷은 직전 2개만 남긴다 (저장소가 무한정 커지는 것 방지)
          for TK in $TICKERS; do
            ls -1 data/snapshots/${TK}_*.csv 2>/dev/null | head -n -2 | xargs -r rm -f
          done

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "자동 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
