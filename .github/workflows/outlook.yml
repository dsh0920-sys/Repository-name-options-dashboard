# 전망 글을 깃허브 안에서 자동으로 쓰고 사이트에 반영하는 워크플로.
name: 전망 글 자동 작성

on:
  schedule:
    # UTC 기준. 저녁분 — 한국시간 21:07 (데이터 갱신 20:00~20:45 직후, 미국장 개장 전)
    - cron: "7 12 * * 1-5"
    # 아침분 — 한국시간 06:45 (update.yml의 06:30 데이터 갱신 직후, 미국장 마감 뒤)
    - cron: "45 21 * * 1-5"
  # 클로드 액션은 push 이벤트를 받지 않는다. 파일을 고쳤을 때의 시험 실행은
  # kick-outlook.yml이 이 workflow_dispatch를 대신 눌러준다.
  workflow_dispatch: {}

permissions:
  contents: write
  # 액션이 자기 토큰을 발급받는 데 필요하다. 없으면 OIDC 오류로 멈춘다.
  id-token: write

# update.yml과 같은 그룹이라 둘이 동시에 밀어넣지 않는다.
concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  TICKERS: QQQ NVDA TSLA AMZN GOOGL SOXX PLTR CRWV IREN IONQ TEM EWY

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install --quiet -r requirements.txt

      - name: 지금이 아침인지 저녁인지 계산
        id: when
        run: |
          KST=$(TZ=Asia/Seoul date '+%Y년 %-m월 %-d일 %H시')
          H=$(TZ=Asia/Seoul date '+%H')
          if [ "$H" -lt 12 ]; then
            echo "text=지금은 한국시간 ${KST}, 아침이다. 미국장은 새벽 5시에 닫혔다. 간밤 결과를 반영해 쓴다. 이 시각에는 옵션 계약 수가 주가보다 하루 뒤처질 수 있다. analytics의 date(옵션 기준일)와 price_date(주가 기준일)가 다르면 글에 그 사실을 한 줄 명시하라." >> "$GITHUB_OUTPUT"
          else
            echo "text=지금은 한국시간 ${KST}, 저녁이다. 미국장은 밤 10시 30분에 열려 새벽 5시에 닫는다. 개장 전 대비 관점으로 쓴다." >> "$GITHUB_OUTPUT"
          fi

      # 열쇠가 제대로 들어왔는지 먼저 본다. 값은 절대 찍지 않고 길이와 앞글자만 확인한다.
      - name: 열쇠 확인
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::열쇠가 비어 있습니다. 시크릿 이름이 CLAUDE_CODE_OAUTH_TOKEN 이 맞는지 확인하세요."
            exit 1
          fi
          echo "::notice::열쇠 길이 ${#TOK}자"
          case "$TOK" in
            sk-ant-oat01-*) echo "::notice::형식 정상 (sk-ant-oat01- 로 시작)" ;;
            sk-ant-api*)    echo "::error::이건 API 키입니다. setup-token 으로 만든 sk-ant-oat01- 값이 필요합니다." ; exit 1 ;;
            sk-ant-*)       echo "::error::sk-ant- 로 시작하지만 oat01 이 아닙니다. 값을 다시 확인하세요." ; exit 1 ;;
            *)              echo "::error::형식이 다릅니다. sk-ant-oat01- 로 시작해야 합니다. 복사할 때 앞부분이 빠졌을 수 있습니다." ; exit 1 ;;
          esac

      - name: 전망 글 쓰기
        id: claude
        uses: anthropics/claude-code-action@v1.0.183
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 예약 실행과 시험 실행 모두 깃허브 로봇 이름으로 들어온다. 없으면 사람이 아니라며 거부한다.
          allowed_bots: "github-actions"
          claude_args: --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            이 저장소는 미국 옵션 대시보드다. 너의 일은 딱 하나 — 종목별 '전망 글'을 새로 쓰는 것이다.
            데이터 수집·계산·HTML 생성은 다른 곳에서 알아서 하므로 절대 건드리지 마라.
            outlook/ 폴더의 마크다운 파일만 쓴다. 다른 파일은 읽기만 하고 고치지 마라.

            ${{ steps.when.outputs.text }}

            ## 절대 원칙 — 쉬운 말
            사용자는 금융을 전혀 모른다.
            ① 한 문장 40자 이내.
            ② 전문용어는 쉬운 말을 먼저 쓰고 괄호로 붙인다.
            ③ 콜=오를 때 돈 버는 보험, 풋=내릴 때 돈 버는 보험.
            ④ 딜러·마켓메이커는 전부 '증권사'로 통일한다.
            ⑤ 감마 국면은 반드시 '변동성을 키우는 구간 / 변동성을 줄이는 구간'으로만 부른다.
               '브레이크/액셀', '잡는손/미는손' 같은 비유는 사용자가 명시적으로 거부했으니 절대 쓰지 마라.
            ⑥ 한국어 문장은 콜론이 아니라 마침표로 끝낸다.

            ## 순서

            1) 종목별 최신 수치를 `data/analytics/{종목}_latest.json`에서 읽어라.
               대상 12종목: QQQ(나스닥100), NVDA(엔비디아), TSLA(테슬라), AMZN(아마존), GOOGL(알파벳A),
               SOXX(반도체), PLTR(팔란티어), CRWV(코어위브), IREN(아이렌), IONQ(아이온큐),
               TEM(템퍼스AI), EWY(한국). 파일이 없는 종목은 건너뛴다.
               읽을 값: date(옵션 기준일), price_date(주가 기준일), spot, chg_pct, put_wall, call_wall,
               gamma_flip, gex_total_bn, max_pain, pcr_oi, atm_iv, opex_biggest, occ, volume_mix.
               `data/history/{종목}_flows.csv` 마지막 3행에서 콜·풋 순유입(call_net, put_net)도 본다.

               **구간 판정은 반드시 `gex_total_bn`의 부호로 하라.** 음수면 '변동성을 키우는 구간',
               양수면 '변동성을 줄이는 구간'이다. gamma_flip은 가격이 크게 움직이면 null이 되므로
               그걸로 판정하면 거꾸로 나온다. gamma_flip은 값이 있을 때만 참고로 언급하라.

            2) WebSearch·WebFetch로 조사하라. 최근 흐름과 그 이유, 이번 주 일정(금리 결정·물가 지표·
               고용 지표), 실적 발표 일정과 결과, 주요 위험. 종목마다 따로 검색하지 말고
               나스닥 전체 흐름 + 개별 뉴스를 묶어 효율적으로 조사하라.

            3) 종목마다 `outlook/{종목}_{기준일}.md`를 새로 써라. 기준일은 그 종목 analytics의
               **date** 값(옵션 기준일)을 그대로 쓴다. 같은 이름의 파일이 이미 있으면 덮어쓴다. 구조:
               `# 지금 시장이 서 있는 자리` (2~3문단)
               `## 앞으로 벌어질 수 있는 일` — 위로 갈 경우 / 그대로일 경우 / 아래로 갈 경우 세 갈래
               `## 이번 주부터 볼 일정` — 날짜별 목록.
                  opex_biggest의 dte가 14 이하면 '이 만기에 계약이 한꺼번에 사라진다'는 경고를 반드시 넣어라.
               `## 걱정거리 3가지`
               마지막 줄에 이탤릭으로:
               *본 자료는 야후 파이낸스 지연 데이터와 공개 웹 소스를 종합한 정보 제공용 분석이며, 투자 자문이 아닙니다. 매매 판단과 책임은 본인에게 있습니다.*

               종목 성격을 살려라. SOXX는 반도체 회사 30여 곳을 담은 바구니, EWY는 한국 주식 바구니,
               나머지는 개별 회사 이슈 중심. 종목 간 대비가 보이면 짚어라.

            **금지사항.** 매수·매도 지시를 쓰지 마라. 그리고 풋월·콜월·맥스페인을 근거로
            '여기서 반등한다/막힌다'고 단정하지 마라. 1년치 백테스트에서 이 세 지표는 예측력이 없었다
            (같은 거리 행사가끼리 비교 시 차이 +2.8%p, -0.2%p). '돈이 여기 몰려 있다'는 위치 정보로만
            서술하고, 시나리오 뒤에 그 사실을 한 줄 덧붙여라. 반대로 변동성 구간(감마)은 검증된
            지표이므로(변동성을 키우는 구간의 다음날 흔들림이 2배) 변동성 서술의 주된 근거로 삼아라.

            **12종목을 하나도 빠뜨리지 마라.** 12개 파일을 다 쓴 뒤에 끝내라.

      # 실행 로그는 열쇠 없이 못 읽으므로, 실패하면 오류 내용을 저장소에 남긴다.
      - name: 실패하면 오류를 저장소에 적기
        if: failure()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p .debug
          {
            echo "=== 실행 $GITHUB_RUN_ID / $(date -u '+%Y-%m-%d %H:%M UTC') ==="
            echo "execution_file 경로: '$EXEC'"
            if [ -n "$EXEC" ] && [ -f "$EXEC" ]; then
              echo "--- 내용 ---"
              head -c 30000 "$EXEC"
            else
              echo "--- 파일이 없어 후보 경로를 훑는다 ---"
              ls -la /tmp/claude-execution* /home/runner/work/_temp/claude-execution* 2>/dev/null || echo "후보 없음"
              find /tmp /home/runner/work/_temp -maxdepth 2 -name "*.json" -newermt "-10 minutes" 2>/dev/null | head -20
            fi
          } > .debug/last-error.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .debug/last-error.txt
          git commit -q -m "실행 오류 기록 $GITHUB_RUN_ID" || exit 0
          git pull --rebase -q -X theirs origin main && git push -q origin main && echo "오류 기록 올림"

      - name: 12종목이 다 나왔는지 검사
        run: |
          python - <<'PY'
          import json, os, sys
          tickers = os.environ["TICKERS"].split()
          bad, ok = [], []
          for tk in tickers:
              p = f"data/analytics/{tk}_latest.json"
              if not os.path.exists(p):
                  print(f"{tk}: 분석 파일이 없어 건너뜀")
                  continue
              d = json.load(open(p, encoding="utf-8"))["date"]
              f = f"outlook/{tk}_{d}.md"
              if not os.path.exists(f):
                  bad.append(f"{tk}: {f} 가 없음")
              elif os.path.getsize(f) < 1500:
                  bad.append(f"{tk}: {f} 가 너무 짧음 ({os.path.getsize(f)}바이트)")
              else:
                  ok.append(tk)
          print("정상:", " ".join(ok))
          if bad:
              print("검사 실패:")
              for b in bad:
                  print(" -", b)
              sys.exit(1)
          PY

      - name: 금지 표현 검사
        run: |
          # 사용자가 명시적으로 거부한 비유 — 나오면 올리지 않는다
          if grep -rlE "브레이크|액셀|잡는 ?손|미는 ?손|사세요|파세요" outlook/; then
            echo "::error::금지된 비유가 들어간 전망 글이 있습니다."
            exit 1
          fi
          # 매매 지시로 읽힐 수 있는 표현은 경고만 (사실 서술일 수 있어 막지는 않는다)
          grep -rlE "매수하세|매도하세|진입하세|손절하세" outlook/ \
            && echo "::warning::매매 지시로 읽힐 수 있는 문장이 있습니다." || true
          echo "금지 표현 검사 통과"

      - name: 대시보드 다시 만들기
        run: |
          for TK in $TICKERS; do
            python make_dashboard.py "$TK" || echo "::warning::$TK 생성 실패"
          done
          mkdir -p docs
          for TK in $TICKERS; do
            [ -f "dashboard/${TK}_dashboard.html" ] && cp "dashboard/${TK}_dashboard.html" "docs/${TK}.html"
          done
          cp docs/QQQ.html docs/index.html
          touch docs/.nojekyll

      - name: 커밋과 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "전망 글 자동 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 데이터 갱신 워크플로가 그 사이 밀어넣었을 수 있어 세 번까지 다시 시도한다.
          # HTML은 양쪽 다 새로 만드므로 충돌 시 방금 만든 쪽(-X theirs)을 남긴다.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "푸시 완료"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::세 번 시도했지만 푸시하지 못했습니다."
          exit 1
